<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Decal screens</title>
<link rel="icon" href="data:,">

<!-- SCAFFOLDING, NOT SHIPPING SURFACE — the SCREEN half of Gate B's walk.

     tools/gallery/ photographs COMPONENTS: one small subject in a stage, with the
     gallery's own nav beside it. A screen cannot be photographed that way. The whole
     question a Live-screen capture answers is what the rows do at 1000x600 — the
     decided C1/Q2 answer is about roughly 120 missing rows — and a screen mounted
     inside the gallery's stage is a screen 260px of nav narrower than the one that
     ships. So the screens walk gets its own document with NO CHROME AT ALL: one
     full-viewport mount host and nothing else in the layout.

     THE STATES ARE DRIVEN BY THE SUITES' OWN FIXTURES, not by markup written here.
     A screen state is a store set plus a stream, and both already exist:
     test/fixtures/live-gates-fixture.js (the real screen, the real stores, a scripted
     HTTP transport and frames pushed through the real reader) and
     test/fixtures/live-loop-fixture.js (the real app-boot over the real WebSocket
     mock). Writing a second way to reach `pendingAmbiguity` would be a second thing to
     drift; the capture and the assertion now stand on one fixture.

     The importmap is index.html's, re-rooted ../../ because this page is two levels
     down — SAME KEYS, and test/tools-port.test.mjs asserts exactly that for this page
     as it does for the gallery's. That test exists because keeping them in step by
     hand failed the first time it mattered, and the failure mode is not an error: it
     is `screensSettled` never being set and the battery writing `unsettled` after its
     timeout, per state, per theme, per geometry. -->
<script type="importmap">
{
  "imports": {
    "lit": "../../vendor/lit.js",
    "uplot": "../../vendor/uPlot.esm.js",
    "iro": "../../vendor/iro.js",
    "reconnecting-websocket": "../../vendor/reconnecting-websocket.js",
    "easymde": "../../vendor/easymde.min.js",
    "src/": "../../src/"
  }
}
</script>

<!-- The same three global sheets the app links, so a screen here sees exactly the
     tokens it will see in the app. -->
<link rel="stylesheet" href="../../styles/tokens.css">
<link rel="stylesheet" href="../../styles/chart-channels.css">
<link rel="stylesheet" href="../../styles/document.css">

<style>
    /* No chrome. The mount host IS the viewport, because a screen capture that is not
       the screen's real box is a baseline that is wrong forever. Tokens only — Gate C
       reads this block (tools/ is inside the scan roots). */
    html, body {
        margin: 0;
        block-size: 100%;
        color: var(--ui-text);
        background-color: var(--ui-canvas);
    }

    /* THE MOUNT IS THE FITTED BOX, NOT THE RAW VIEWPORT (src/lib/app-fit.js).
       "The mount host IS the viewport" was true while the app laid out at the
       viewport's own size. It stopped being true when the fit landed: the app is drawn
       at a 1200-unit reference height and scaled, so on the bench tablet the screen's
       real box is 1919x1200 design units painted into 1281x801. A capture of a raw
       1281-wide mount is a capture of a layout the tablet never shows — which is
       exactly the trap this comment warns about, one level up. Same three properties
       app-root carries in styles/document.css, so a screen here still sees exactly the
       box it will see in the app. */
    #mount {
        display: block;
        zoom: var(--ui-app-scale, 1);
        inline-size: var(--ui-app-w, 100%);
        block-size: var(--ui-app-h, 100dvh);
        overflow: hidden;
    }

    /* The selector fixture mounts into `#stage` — the id its own render suite's stage
       carries — so screens.js creates that host inside #mount for the states that need
       one. It fills the mount by default; the collapsed-split state narrows it to a
       width read off the split's exported threshold, which is a CONTAINER state and
       cannot be reached by choosing a geometry. */
    #stage {
        display: block;
        inline-size: 100%;
        block-size: 100%;
    }

    /* Only visible when a state fails to drive — the battery records the failure as
       `unsettled` and this says which one, in the PNG itself. */
    #fault {
        position: fixed;
        inset-block-start: 0;
        inset-inline: 0;
        padding: var(--ui-space-3);
        font-family: var(--ui-font-family);
        font-size: var(--ui-text-note);
        color: var(--ui-text);
        background-color: var(--ui-surface);
        border-block-end: var(--ui-border-w) solid var(--ui-line);
    }
</style>
</head>
<body>
<div id="mount"></div>
<script type="module" src="./screens.js"></script>
</body>
</html>
